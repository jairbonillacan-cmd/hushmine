name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # Vulkan por software (lavapipe) para que las pruebas de GPU y las
      # capturas funcionen en Linux sin tarjeta gráfica.
      - name: Vulkan por software (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1
          echo "HUSH_REQUIRE_GPU=1" >> "$GITHUB_ENV"
          echo "WGPU_BACKEND=vulkan" >> "$GITHUB_ENV"

      - name: Formato
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Pruebas
        run: cargo nextest run --workspace

      - name: Compilar release
        run: cargo build --workspace --release

      - name: Simulación y captura (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo run --release -p hush-cli -- sim --seed 42 --bots 4 --report out/sim.json
          cargo run --release -p hush-cli -- netsim --rtt 150 --loss 2 --seconds 60 --report out/netsim.json
          cargo run --release -p hush-cli -- bench --seed 42 --out out/bench.json
          for scene in cube terrain tunnel shaft dig players; do
            cargo run --release -p hush-cli -- shot --scene "$scene" --out "out/$scene.png"
          done

      - name: Subir capturas e informes
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: shots-and-reports
          path: out/

  python-tools:
    name: Herramientas de Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cada carpeta de tools/ con archivos test_*.py; las nuevas entran solas.
      - name: Pruebas unitarias
        run: |
          for dir in tools/*/; do
            if ls "$dir"test_*.py > /dev/null 2>&1; then
              echo "::group::$dir"
              python -B -m unittest discover -s "$dir" -v
              echo "::endgroup::"
            fi
          done

      - name: Verificadores de contenido
        run: |
          python -B tools/lore/check_lore.py
          python -B tools/docs/check_docs.py
          python -B tools/i18n/check_ftl.py

      # Los recursos generados en el repositorio deben coincidir byte a byte
      # con lo que producen sus scripts.
      - name: Recursos generados al día
        run: |
          python -B tools/textures/build_all.py --check
          python -B tools/audio/build_all.py --check
          python -B tools/ui/build_all.py --check

      - name: Informes reproducibles
        run: |
          python -B tools/balance/seismo_sim.py
          python -B tools/mapgen/generate.py --seed 42 --report
          git diff --exit-code

  deny:
    name: Licencias y dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
